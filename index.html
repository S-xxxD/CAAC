<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="本地优先的 CAAC 视距内无人机刷题工具" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./assets/icons/icon-192.png" />
    <link rel="stylesheet" href="./styles.css?v=3" />
    <title>CAAC 训练舱</title>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="主导航">
        <a class="brand" href="#home" data-nav="home" aria-label="返回学习总览">
          <img src="./assets/icons/icon-192.png" alt="" width="42" height="42" />
          <span>
            <strong>CAAC 训练舱</strong>
            <small>视距内驾驶员</small>
          </span>
        </a>

        <nav class="side-nav">
          <button class="nav-item active" type="button" data-view="home">
            <span class="nav-icon" data-icon="home"></span><span>学习总览</span>
          </button>
          <button class="nav-item" type="button" data-view="practice">
            <span class="nav-icon" data-icon="book-open"></span><span>章节练习</span>
          </button>
          <button class="nav-item" type="button" data-view="exam">
            <span class="nav-icon" data-icon="clipboard-check"></span><span>模拟考试</span>
          </button>
          <button class="nav-item" type="button" data-view="review">
            <span class="nav-icon" data-icon="bookmark"></span><span>错题收藏</span>
          </button>
          <button class="nav-item" type="button" data-view="stats">
            <span class="nav-icon" data-icon="chart"></span><span>学习统计</span>
          </button>
        </nav>

        <div class="sidebar-spacer"></div>
        <button class="nav-item" type="button" data-view="settings">
          <span class="nav-icon" data-icon="settings"></span><span>设置</span>
        </button>
        <div class="local-status">
          <span class="status-dot" aria-hidden="true"></span>
          <span><strong>本地模式</strong><small>进度仅保存在此设备</small></span>
        </div>
      </aside>

      <div class="main-column">
        <header class="topbar">
          <a class="mobile-brand" href="#home" data-nav="home" aria-label="返回学习总览">
            <img src="./assets/icons/icon-192.png" alt="" width="36" height="36" />
            <span>CAAC 训练舱</span>
          </a>
          <div class="topbar-spacer"></div>
          <span class="offline-state" id="network-state">
            <span class="status-dot" aria-hidden="true"></span><span>已就绪</span>
          </span>
          <button class="icon-button install-trigger hidden" id="top-install" type="button" aria-label="安装应用" title="安装应用">
            <span data-icon="download"></span>
          </button>
          <button class="icon-button" type="button" data-view="settings" aria-label="打开设置" title="设置">
            <span data-icon="settings"></span>
          </button>
        </header>

        <main id="view-root" class="view-root" tabindex="-1">
          <div class="loading-state">
            <span class="loading-mark" aria-hidden="true"></span>
            <strong>正在装载题库</strong>
          </div>
        </main>
      </div>

      <nav class="mobile-nav" aria-label="移动端主导航">
        <button class="mobile-nav-item active" type="button" data-view="home">
          <span data-icon="home"></span><span>总览</span>
        </button>
        <button class="mobile-nav-item" type="button" data-view="practice">
          <span data-icon="book-open"></span><span>练习</span>
        </button>
        <button class="mobile-nav-item" type="button" data-view="exam">
          <span data-icon="clipboard-check"></span><span>考试</span>
        </button>
        <button class="mobile-nav-item" type="button" data-view="review">
          <span data-icon="bookmark"></span><span>错题</span>
        </button>
        <button class="mobile-nav-item" type="button" data-view="stats">
          <span data-icon="chart"></span><span>统计</span>
        </button>
      </nav>
    </div>

    <dialog id="app-dialog" class="app-dialog">
      <div id="dialog-content"></div>
    </dialog>
    <input id="import-file" type="file" accept="application/json,.json" hidden />
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="./app.js?v=3" defer></script>
  </body>
</html>
